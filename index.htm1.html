<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zaman — المتجر</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Cormorant+Garamond:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#fff;--ink:#1A1A1A;--muted:#6A6A6A;--line:#E7E7E7;--accent:#B0343F;--on-accent:#fff;--chip:#F4F4F4;--ok:#3F7A4A;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px}
.brand{font-weight:700;font-size:1.6rem;margin-inline-end:auto;letter-spacing:.14em;text-transform:uppercase;direction:ltr}
.brand span{font-weight:400;color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select,input,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.cartbtn{border:0;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:7px 16px;cursor:pointer;font-weight:600}
.cartbtn b{display:inline-block;min-width:1.5em;margin-inline-start:6px;background:var(--on-accent);color:var(--accent);border-radius:6px;text-align:center}
.fab{display:none}
.hero,.tools,main{max-width:1100px;margin:0 auto;padding-inline:16px}
.hero{padding-top:36px;padding-bottom:10px}
.hero h1{font-size:clamp(2.2rem,6.5vw,3.8rem);line-height:1.25;margin:0 0 10px;max-width:15em}
.hero p{margin:0;color:var(--muted);max-width:34em}
.demo{display:inline-block;margin-top:12px;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:2px 12px;font-size:.88rem}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding-top:18px;padding-bottom:6px}
.tools input{flex:1 1 200px;min-width:0}
.chip{border:1px solid var(--line);background:none;border-radius:99px;padding:5px 16px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{padding-top:12px;padding-bottom:60px;display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.none{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.art{position:relative;background:#fff;height:290px;overflow:hidden;padding:14px;margin:12px 12px 0;border-radius:12px;border:1px solid var(--line);cursor:pointer}
.art img{display:block;width:100%;height:100%;object-fit:contain}
.info{padding:12px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.maker{margin:0;color:var(--muted);font-size:.88rem;direction:ltr;text-align:start}
.info h2{margin:0;font-size:1.45rem;line-height:1.3;cursor:pointer}
.notes{margin:0;color:var(--muted);font-size:.93rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.chips span{background:var(--chip);border-radius:6px;padding:1px 10px;font-size:.82rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.price{font-weight:700;font-size:1.2rem}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:8px 18px;cursor:pointer;font-weight:600}
.ghost{border:1px solid var(--ink);background:none;color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer}
.back{position:fixed;inset:0;background:rgba(10,10,10,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.sheet{position:fixed;inset-inline:0;bottom:0;margin-inline:auto;width:min(100%,520px);max-height:90vh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .25s;z-index:50;padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.wrap.open .back{opacity:1;pointer-events:auto}
.wrap.open .sheet{transform:none}
.head{display:flex;justify-content:space-between;align-items:center}
.head h3{margin:0;font-size:1.3rem}
.x{border:0;background:none;font-size:1.6rem;cursor:pointer;line-height:1}
.pimg{background:#fff;border:1px solid var(--line);border-radius:12px;height:240px;padding:12px;margin:10px 0}
.pimg img{display:block;width:100%;height:100%;object-fit:contain}
.sheet ul{margin:6px 0;padding-inline-start:20px;color:var(--muted)}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer}
.line{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.line img{width:44px;height:44px;object-fit:contain;border-radius:6px;border:1px solid var(--line)}
.line small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.hint{font-size:.88rem;color:var(--muted);margin:2px 0}
.sug{width:100%;border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:10px;padding:8px;margin:6px 0;cursor:pointer;font-weight:500}
.sum{display:flex;justify-content:space-between;margin:2px 0}
.sum.t{font-weight:700;font-size:1.15rem;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
.sum.d{color:var(--ok)}
.f{width:100%;margin:6px 0}
.send{display:block;text-align:center;text-decoration:none;background:var(--ok);color:#fff;border-radius:10px;padding:11px;font-weight:600;margin-top:6px}
.send[aria-disabled="true"]{opacity:.45;pointer-events:none}
.heart{position:absolute;top:10px;inset-inline-start:10px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.14);display:grid;place-items:center;padding:0;cursor:pointer;z-index:2}
.heart svg{width:22px;height:22px;transition:transform .15s}
.heart[aria-pressed="true"] svg{transform:scale(1.12)}
.codebox{display:flex;gap:6px;margin:6px 0}.codebox input{flex:1;min-width:0}
.foot2{max-width:1100px;margin:0 auto;padding:24px 16px 90px;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}
.brand,.hero h1,.info h2,.head h3,.sheet h3{font-family:"Cormorant Garamond",Amiri,Georgia,serif}
.price{font-family:Tajawal,"Segoe UI",sans-serif;font-variant-numeric:lining-nums tabular-nums;font-weight:700}
.hero h1,.info h2,.head h3{font-weight:700}
.ann{background:var(--ink);color:#fff;text-align:center;padding:8px 12px;font-size:.9rem}
.feat{max-width:1100px;margin:0 auto;padding:30px 16px 10px}
.feat h2{text-align:center;font-family:"Cormorant Garamond",Amiri,Georgia,serif;font-size:1.9rem;margin:0 0 18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fi{border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
.fi .ic{width:56px;height:56px;border-radius:50%;background:var(--chip);display:grid;place-items:center;margin:0 auto 10px}
.fi .ic svg{width:28px;height:28px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.fi b{display:block}.fi span{color:var(--muted);font-size:.92rem}
.wa{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#25D366;display:grid;place-items:center;z-index:25;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.wa svg{width:30px;height:30px;fill:#fff}
.foot2 details{border-bottom:1px solid var(--line);padding:10px 0}.foot2 summary{cursor:pointer;font-weight:600;color:var(--ink)}.foot2 p{margin:8px 0 0}
.banner{max-width:1100px;margin:18px auto 0;padding-inline:16px}
.bwin{overflow:hidden;border-radius:16px}
.track{display:flex;transition:transform .5s ease}
.sl{flex:0 0 100%;min-height:200px;display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:10px;padding:18px;color:#fff}
.st small{display:inline-block;background:rgba(255,255,255,.18);border-radius:99px;padding:1px 12px;font-size:.8rem}
.st h3{margin:8px 0 4px;font-size:1.35rem;line-height:1.3;font-family:"Cormorant Garamond",Amiri,Georgia,serif;font-weight:700}
.st p{margin:0 0 10px;opacity:.9;font-size:.92rem}
.st .btn{background:#fff;color:var(--ink)}
.si{background:#fff;border-radius:12px;height:170px;padding:8px}
.si img{display:block;width:100%;height:100%;object-fit:contain}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots button{width:8px;height:8px;border-radius:99px;border:0;background:var(--line);padding:0;cursor:pointer;transition:width .2s}
.dots button[aria-current="true"]{width:22px;background:var(--ink)}
@media (min-width:700px){.sl{min-height:260px;padding:28px}.si{height:220px}.st h3{font-size:1.9rem}}
@media (prefers-reduced-motion:reduce){.track{transition:none}}
.cartic{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid!important;place-items:center;cursor:pointer;padding:0}
.cartic svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cartic b{position:absolute;top:-5px;inset-inline-end:-5px;min-width:20px;height:20px;border-radius:99px;background:var(--accent);color:#fff;font-size:.75rem;line-height:20px;text-align:center;padding:0 5px}
html[dir=rtl] .cartic{order:-1}
.cartic.bump{animation:bump .45s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.fly{position:fixed;width:16px;height:16px;border-radius:50%;background:var(--accent);z-index:80;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.fab{display:none!important}
@media (prefers-reduced-motion:reduce){.cartic.bump{animation:none}}
.cartic{width:46px;height:46px;border-radius:14px;background:var(--ink);border-color:var(--ink)}
.cartic svg{stroke:#fff;stroke-width:1.7}
.cartic.jelly{animation:jelly .65s ease}
@keyframes jelly{0%{transform:scale(1,1)}30%{transform:scale(1.25,.8)}50%{transform:scale(.88,1.15)}70%{transform:scale(1.08,.96)}100%{transform:scale(1,1)}}
.cartic b.ring{animation:ring .7s ease-out}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(176,52,63,.65)}100%{box-shadow:0 0 0 14px rgba(176,52,63,0)}}
.flyimg{position:fixed;z-index:80;pointer-events:none;background:#fff;border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.28);object-fit:contain;padding:4px}
@media (prefers-reduced-motion:reduce){.cartic.jelly,.cartic b.ring{animation:none}}
.btn{background:var(--ink);color:#fff;transition:background .15s}
.btn:hover{background:#3a3a3a}

.card{border-radius:16px;transition:box-shadow .2s,transform .2s}

.info{padding:8px 12px 12px;gap:2px}

.price{font-size:clamp(.82rem,3.7vw,1.02rem);white-space:nowrap}
.plus{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .15s}
.plus:active{transform:scale(.9)}

.brand .dial{width:.82em;height:.82em}

.brand .bs i:last-child{background:linear-gradient(270deg,transparent,#b8924a)}
